                    data-fallback="mailto", action="mailto:todd@barnettarchitecture.com" method="post" enctype="text/plain";

                    mailto:?subject=Project enquiry — <type> — <location>&body=<labelled lines> then announces in role=status.
                    Visible <label> per field with "(required)"/"(optional)"; project type options = taxonomy.json

<section class="enquiry-form shell band" data-section="enquiry-form" data-intent="collect a project enquiry" data-layout="side-rail" data-module="enquiry-form" aria-labelledby="{{id}}">
  <div class="enquiry-form__head"><h2 id="{{id}}">{{heading}}</h2><p>{{captured sentence}}</p></div>
  <form id="enquiry" action="mailto:todd@barnettarchitecture.com" method="post" enctype="text/plain" data-placeholder="true" data-backend="none" data-fallback="mailto" aria-describedby="form-note">
    <!-- repeat: name (required, autocomplete=name), email (required, type=email), phone (optional, type=tel), location (optional), type <select>, message (required, textarea, .field--wide) -->
    <div class="field"><label for="{{f}}">{{Label}} <span>({{required|optional}})</span></label><input id="{{f}}" name="{{f}}" aria-describedby="{{f}}-err"><p class="field__error" id="{{f}}-err" aria-live="polite"></p></div>
    <div class="placeholder-note" id="form-note"><span class="placeholder-note__tag">PLACEHOLDER · form backend</span><span>{{note}}</span></div>
    <div class="enquiry-form__actions"><button class="btn-primary" type="submit">Send by email</button><p class="enquiry-form__status" role="status"></p></div>
  </form>
</section>
