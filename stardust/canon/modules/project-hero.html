<section class="hero" data-section="hero" data-intent="{{intent}}" data-layout="full-bleed" data-media="image" data-module="project-hero">
  <div class="hero__media" data-slot="image">{{image: responsive <img>, loading="eager" fetchpriority="high", sizes="100vw"}}</div>
  <div class="hero__content shell">
    <h1 class="hero__title" data-slot="title">
      <span class="hero__thesis">{{title}}</span><span class="visually-hidden"> — </span>
      <span class="hero__who">{{subtitle: who / where line, optional}}</span>
    </h1>
    <p class="hero__caption dim dim--stack" data-slot="facts"><span>{{facts: e.g. <a href="/projects/…">Project</a> · Type · Location}}</span></p>
  </div>
</section>
