<dialog id="lightbox" class="lightbox" aria-label="{{label}} — photograph viewer" data-module="photo-lightbox">
  <div class="lightbox__bar"><p class="lightbox__title label">{{label}}</p><button class="lightbox__btn" type="button" data-lb-close><span class="lightbox__btn-label">Close</span><span aria-hidden="true">×</span></button></div>
  <figure class="lightbox__stage"><div class="lightbox__frame"></div><figcaption class="lightbox__caption" hidden></figcaption></figure>
  <div class="lightbox__bar"><button class="lightbox__btn" type="button" data-lb-prev><span aria-hidden="true">←</span><span class="lightbox__btn-label">Previous</span></button><p class="lightbox__count label" aria-live="polite"><span aria-hidden="true">1 / {{N}}</span><span class="visually-hidden">Photo 1 of {{N}}</span></p><button class="lightbox__btn" type="button" data-lb-next><span class="lightbox__btn-label">Next</span><span aria-hidden="true">→</span></button></div>
</dialog>
<script>
(() => {
  const dlg = document.getElementById('lightbox'), wall = document.querySelector('[data-lightbox-group]');
  if (!dlg || !wall || !dlg.showModal) return;
  const links = [...wall.querySelectorAll('a[data-lb]')], n = links.length;
  if (!n) return;
  const q = (s) => dlg.querySelector(s), stage = q('.lightbox__stage'), frame = q('.lightbox__frame'), count = q('.lightbox__count'), cap = q('.lightbox__caption');
  const base = location.pathname + location.search;
  let img = null, i = 0, opener = null, x0 = null, popping = false;
  const thumb = (a) => a.querySelector('img');
  const load = (el, a, sizes) => { el.sizes = sizes; el.srcset = thumb(a).getAttribute('srcset'); el.src = a.href; };
  const drawn = (a) => { const r = frame.getBoundingClientRect(); return Math.ceil(Math.min(r.width, r.height * (a.dataset.w / a.dataset.h))) + 'px'; };
  const show = (k) => {
    i = (k + n) % n; const a = links[i], fig = a.closest('figure'), t = thumb(a);
    if (!img) {
      img = new Image(); img.decoding = 'async'; frame.append(img);
      img.addEventListener('error', () => { cap.hidden = false; cap.textContent = 'This photograph could not be loaded. Use Previous or Next to continue.'; });
    }
    img.width = +a.dataset.w; img.height = +a.dataset.h; img.alt = t.alt;
    img.style.setProperty('--ar', a.dataset.w / a.dataset.h);
    img.style.backgroundImage = t.currentSrc ? `url("${t.currentSrc}")` : 'none';
    load(img, a, drawn(a));
    count.innerHTML = `<span aria-hidden="true">${i + 1} / ${n}</span><span class="visually-hidden">Photo ${i + 1} of ${n}</span>`;
    const fc = fig.querySelector('figcaption');
    cap.innerHTML = fc ? fc.innerHTML : ''; cap.hidden = !fc;
    if (fig.id) history.replaceState({ lb: 1 }, '', '#' + fig.id);
    // preload the next photograph only, at the width it will be drawn (never the full 2400 rendition)
    if (n > 1) { const nx = links[(i + 1) % n]; load(new Image(), nx, drawn(nx)); }
  };
  const open = (k, from) => {
    opener = from || links[k];
    if (!dlg.open) { dlg.showModal(); if (!(history.state && history.state.lb)) history.pushState({ lb: 1 }, '', location.href); }
    show(k); q('[data-lb-next]').focus();
  };
  const close = () => { if (history.state && history.state.lb) history.back(); else dlg.close(); };
  addEventListener('popstate', () => { if (dlg.open) { popping = true; dlg.close(); } });
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
  dlg.addEventListener('close', () => {
    if (!popping && history.state && history.state.lb) history.replaceState(null, '', base);
    popping = false;
    if (img) { img.removeAttribute('srcset'); img.removeAttribute('src'); }
    if (opener) opener.focus();
  });
  links.forEach((a, k) => a.addEventListener('click', (e) => {
    if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault(); open(k, a);
  }));
  q('[data-lb-prev]').addEventListener('click', () => show(i - 1));
  q('[data-lb-next]').addEventListener('click', () => show(i + 1));
  q('[data-lb-close]').addEventListener('click', close);
  stage.addEventListener('click', (e) => { if (e.target === stage || e.target === frame) close(); });
  dlg.addEventListener('keydown', (e) => {
    const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (step) { e.preventDefault(); show(i + step); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(n - 1); }
    else if (e.key === 'Tab') {
      const f = [...dlg.querySelectorAll('button, a[href]')].filter((el) => el.getClientRects().length);
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  dlg.addEventListener('pointerdown', (e) => { x0 = e.pointerType === 'mouse' ? null : e.clientX; });
  dlg.addEventListener('pointerup', (e) => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 48) show(i + (dx < 0 ? 1 : -1)); });
  const deep = () => {
    const m = location.hash.match(/^#photo-(\d+)$/), k = m ? links.findIndex((a) => a.closest('figure').id === 'photo-' + m[1]) : -1;
    if (k >= 0 && !dlg.open) { history.replaceState(null, '', base); open(k); }
  };
  addEventListener('hashchange', deep); deep();
})();
</script>
