<section class="principles shell band" data-section="principles" data-intent="explain the practice" data-layout="grid" data-items="4" data-module="principles" aria-labelledby="{{id}}">
  <div class="principles__head">
    <h2 id="{{id}}">{{heading}}</h2>
    <p class="principles__links"><a class="link-arrow" href="{{href}}">{{label}}</a></p>
  </div>
  <div class="principles__sheet" data-slot="items">
    <!-- repeat: 2×2 hairline sheet; items are captured About copy only -->
    <div class="principle"><h3>{{title}}</h3><p>{{text}}</p></div>
  </div>
</section>
