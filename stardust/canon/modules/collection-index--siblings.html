<section class="darkroom more" id="more" data-section="more-collections" data-intent="continue to a sibling collection" data-layout="strip" data-items="7" data-module="collection-index" aria-labelledby="more-h">
  <div class="shell">
    <div class="section-head"><h2 id="more-h">More collections</h2><a class="link-arrow" href="/photography">All collections</a></div>
    <ul class="siblings" data-slot="collections">
      <!-- the 7 other collections in hub order; cover = home-teaser frame, 3:2 fill crop -->
      <li><div class="sibling"><div class="sibling__img">{{img 3:2, lazy}}</div><p class="sibling__title"><a href="/photography/{{name}}">{{title}}</a></p><p class="sibling__count label">{{N}} photographs</p></div></li>
    </ul>
  </div>
</section>
